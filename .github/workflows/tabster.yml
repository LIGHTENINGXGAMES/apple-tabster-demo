name: Apple Tabster

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tabster.yml'
      - 'apps/tabster/**'
      - 'scripts/build-tabster.sh'

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS 27 arm64 guest
        run: bash scripts/build-tabster.sh iphoneos
      - name: Build simulator reference
        run: bash scripts/build-tabster.sh iphonesimulator
      - name: Capture native iOS 27 reference
        shell: bash
        run: |
          set -euo pipefail
          runtime=$(xcrun simctl list runtimes --json | python3 -c '
          import json,sys
          matches=[r["identifier"] for r in json.load(sys.stdin)["runtimes"]
                   if "iOS-27-0" in r["identifier"] and r["isAvailable"]]
          if not matches: sys.exit("No iOS 27.0 simulator runtime is installed")
          print(matches[0])')
          device=$(xcrun simctl create TabsterReference com.apple.CoreSimulator.SimDeviceType.iPhone-14 "$runtime")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl status_bar "$device" override --time 9:41 --batteryState charged --batteryLevel 100
          xcrun simctl install "$device" target/tabster/iphonesimulator/Tabster.app
          launch=$(xcrun simctl launch "$device" org.lstudio.apple.Tabster)
          printf '%s\n' "$launch"
          pid=${launch##*: }
          sleep 5
          xcrun simctl spawn "$device" log show --last 3m --style compact \
            --predicate 'process == "Tabster" OR eventMessage CONTAINS[c] "org.lstudio.apple.Tabster"' \
            > target/tabster/simulator.log
          xcrun simctl io "$device" screenshot target/tabster/ios27-native.png
          container=$(xcrun simctl get_app_container "$device" org.lstudio.apple.Tabster data)
          cp -R "$container/Documents/reference" target/tabster/reference
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -name 'Tabster*' \
            -exec cp '{}' target/tabster/ \;
          kill -0 "$pid"
          test -z "$(find target/tabster -maxdepth 1 -name 'Tabster*.ips' -print -quit)"
          xcrun simctl shutdown "$device"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tabster-ios27
          path: target/tabster/
          if-no-files-found: error
          retention-days: 7
